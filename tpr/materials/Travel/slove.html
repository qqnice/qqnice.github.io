<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斯洛維尼亞學術與自然深度之旅</title>
    
    <!-- 載入 Tailwind CSS (排版與樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 Leaflet 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 自訂樣式 (隱藏捲軸與動畫) -->
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>
<body id="app-body" class="min-h-screen bg-gradient-to-br transition-colors duration-1000 ease-in-out font-sans flex flex-col">

    <!-- 頁首標題區 -->

        <h1 class="text-3xl md:text-5xl font-serif text-slate-800 leading-tight mb-3">
            斯洛維尼亞的深呼吸，<br class="md:hidden" />
            <span class="text-xl md:text-3xl text-slate-500 font-light mt-2 md:mt-4 block tracking-wide">
                學術與自然交織的 9 天深度之旅。
            </span>
        </h1>
        <p class="text-sm md:text-base text-slate-400 font-medium tracking-widest uppercase">
            ICITL 2026 & Nature Retreat
        </p>
    </header>

    <!-- 橫向時間軸導航 -->
    <div class="sticky top-0 z-30 bg-white/60 backdrop-blur-md shadow-sm border-b border-white/40">
        <nav id="timeline-nav" class="flex overflow-x-auto hide-scrollbar px-4 py-4 md:px-12 items-center gap-3 md:gap-6"></nav>
    </div>

    <!-- 主要內容區 -->

        <!-- 左側/上方：文字資訊卡片 -->
        <div class="flex flex-col gap-6">
            
            <!-- 結合當地照片與標題的背景橫幅 -->
            <div id="image-container" class="w-full h-64 md:h-72 rounded-3xl shadow-xl bg-slate-300 relative overflow-hidden flex flex-col justify-end p-6 md:p-8 group">
                <!-- 實體 img 標籤 -->
                <img id="day-image" src="" alt="Location Image" class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-1000 group-hover:scale-105" />

                <!-- 漸層遮罩 -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent z-10"></div>
                
                <div class="relative z-20">
                    <div id="day-badge" class="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-white text-sm font-bold mb-3 tracking-wider border border-white/40 shadow-sm">
                        <!-- Date • Location -->
                    </div>
                    <h2 id="day-title" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight drop-shadow-lg">
                        <!-- Title -->
                    </h2>
                </div>
            </div>

            <!-- 內容資訊區塊 -->
            <div id="info-card" class="p-6 rounded-3xl backdrop-blur-md border shadow-xl transition-all duration-500">
                
                <!-- 當地導覽介紹 -->
                <div class="mb-6 bg-white/50 rounded-2xl p-5 border border-white/60 shadow-sm">
                    <h3 class="flex items-center text-lg font-bold mb-3 opacity-90 text-indigo-900">
                        <span class="mr-2 text-xl">📖</span> 當地導覽與學術隨想
                    </h3>
                    <p id="day-guide" class="text-base md:text-lg leading-relaxed font-medium text-slate-800">
                        <!-- Guide content -->
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <!-- 住宿 -->
                    <div class="bg-white/40 rounded-2xl p-4">
                        <h3 class="flex items-center text-sm font-bold mb-1 opacity-70">
                            <span class="mr-2">🛏️</span> 住宿與安頓
                        </h3>
                        <p id="day-stay" class="font-semibold text-lg"><!-- Stay --></p>
                    </div>
                    <!-- 時間 -->
                    <div class="bg-white/40 rounded-2xl p-4">
                        <h3 class="flex items-center text-sm font-bold mb-1 opacity-70">
                            <span class="mr-2">⏱️</span> 時間規劃
                        </h3>
                        <p id="day-time" class="font-semibold text-lg"><!-- Time --></p>
                    </div>
                </div>

                <!-- 行程動線 -->
                <div class="mb-6 bg-white/40 rounded-2xl p-4">
                    <h3 class="flex items-center text-sm font-bold mb-2 opacity-70">
                        <span class="mr-2">🗺️</span> 行程動線
                    </h3>
                    <p id="day-activity" class="font-medium leading-relaxed"><!-- Activity --></p>
                </div>

                <!-- 注意事項 -->
                <div class="bg-amber-500/10 text-amber-900 rounded-2xl p-4 border border-amber-500/20">

                        <span class="mr-2">⚠️</span> 交通與注意事項

                    <p id="day-note" class="text-sm font-medium"><!-- Note --></p>
                </div>

            </div>
        </div>

        <!-- 右側/下方：地圖視覺 -->
        <div class="h-80 lg:h-full min-h-[400px] w-full relative rounded-3xl overflow-hidden shadow-2xl border-4 border-white/60 bg-slate-200">
            <div id="map-container" class="absolute inset-0 w-full h-full z-0"></div>
            
            <div class="absolute top-4 left-4 z-[400] bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg text-sm font-bold text-slate-700 flex items-center">
                <span class="animate-pulse mr-2 h-2 w-2 bg-indigo-500 rounded-full"></span>
                即時軌跡追蹤
            </div>
        </div>

    </main>
    
    <!-- 頁尾 -->
    <footer class="text-center py-8 text-slate-400 text-sm font-medium">
        Designed for a perfect blend of Academic Research & Nature Retreat.
    </footer>

                note: "湖畔碎石較多，建議換上水鞋。山頂氣溫較低，需備妥防風外套。"
            },
            {
                day: 6, date: "8/8 (六)", title: "跨國高空靜修與邊界之水", location: "Tarvisio", theme: "mountain", coords: [46.5085, 13.5186],
                image: "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1000&q=80",

                note: "進入義大利境內請隨身攜帶護照。山區路段蜿蜒，請放慢車速享受風景。"

                note: "穿著水鞋以應付濕滑地形。行程極具彈性，可視體力決定在溪谷停留的時間。"

            {

                image: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1000&q=80",
                stay: "什科菲亞洛卡 Škofja Loka", time: "下午抵達",
                activity: "托爾明 ➔ Most na Soči 火車站搭乘汽車火車 ➔ 什科菲亞洛卡古鎮漫遊與住宿。",

                note: "汽車火車班次有限，需提前確認時刻表並提早抵達車站排隊上車。"

            {
                day: 9, date: "8/11 (二)", title: "學術收尾與滿載賦歸", location: "Ljubljana", theme: "city", coords: [46.0569, 14.5058],
                image: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=1000&q=80",
                stay: "準備返程 / 飛機上", time: "早上還車",
                activity: "什科菲亞洛卡 ➔ 盧比安納市區還車 ➔ 河畔咖啡廳論文收尾與採買 ➔ 搭機返台。",
                guide: "【盧比安納的最後咖啡香】 旅程的最後一天，回到熟悉的盧比安納。漫步於 Čokl 或 Zvezda Cafe 等在地咖啡館，提供了一個不被打擾的空間。您可以將手機架在桌上紀錄工作的最後時刻，離線完成教學研究的最後潤飾。在溫暖的陽光與河畔的微風中，為這趟融合了國際研討會、自然奇景與深度思考的旅程，畫下完美的句點。",
                note: "早上 11:00 前至市區據點完成還車（記得先加滿油並拍照存證）。傍晚叫車前往機場。"
            }
        ];

        // 佈景主題設定
        const themeColors = {
            lake: "bg-sky-50/90 text-sky-900 border-sky-200",
            mountain: "bg-slate-50/90 text-slate-900 border-slate-200",
            nature: "bg-emerald-50/90 text-emerald-900 border-emerald-200",
            ancient: "bg-amber-50/90 text-amber-900 border-amber-200",
            city: "bg-indigo-50/90 text-indigo-900 border-indigo-200"
        };

        const gradientBackgrounds = {
            lake: "from-sky-100 via-white to-blue-50",
            mountain: "from-slate-200 via-white to-gray-100",
            nature: "from-emerald-100 via-white to-green-50",
            ancient: "from-amber-100 via-white to-orange-50",
            city: "from-indigo-100 via-white to-purple-50"
        };

        // 全域變數
        let activeIdx = 0;
        let map, marker;
        const navContainer = document.getElementById('timeline-nav');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderTimeline();
            updateContent(0);
        });

        function initMap() {
            // 初始化 Leaflet 地圖
            map = L.map('map-container', {
                zoomControl: false,
                dragging: !L.Browser.mobile
            }).setView(itineraryData[0].coords, 8);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // 套用 CartoDB 底圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // 畫路線
            const latlngs = itineraryData.map(d => d.coords);
            L.polyline(latlngs, { color: '#4f46e5', weight: 3, dashArray: '8, 8', opacity: 0.7 }).addTo(map);

            // 建立車子標記
            const carIcon = L.divIcon({
                html: '<div style="font-size: 28px; filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.4)); transform: scaleX(-1);">🚗</div>',
                className: 'bg-transparent border-0',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            marker = L.marker(itineraryData[0].coords, { icon: carIcon }).addTo(map);
        }

        function renderTimeline() {
            navContainer.innerHTML = '';
            itineraryData.forEach((day, idx) => {
                const isActive = idx === activeIdx;
                const btnClass = isActive 
                    ? 'bg-white shadow-lg scale-110 border-b-4 border-indigo-600 text-indigo-900' 
                    : 'bg-white/40 hover:bg-white/70 text-slate-500 hover:scale-105';
                const fontClass = isActive ? 'font-bold' : 'font-medium';

                const button = document.createElement('button');
                button.className = `flex-shrink-0 flex flex-col items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-2xl transition-all duration-300 ${btnClass}`;
                button.innerHTML = `
                    <span class="text-xs font-bold tracking-widest mb-1">DAY ${day.day}</span>
                    <span class="text-sm md:text-base ${fontClass}">${day.location.split(' ')[0]}</span>
                    <span class="text-[10px] mt-1 opacity-70">${day.date}</span>
                `;
                button.onclick = () => handleDayClick(idx, button);
                navContainer.appendChild(button);
            });
        }

        function handleDayClick(idx, buttonEl) {
            if (activeIdx === idx) return;
            activeIdx = idx;
            
            // 時間軸置中捲動
            const scrollLeft = buttonEl.offsetLeft - (navContainer.offsetWidth / 2) + (buttonEl.offsetWidth / 2);
            navContainer.scrollTo({ left: scrollLeft, behavior: 'smooth' });

            renderTimeline();
            updateContent(idx);
        }

        function updateContent(idx) {
            const data = itineraryData[idx];

            // 1. 更新背景漸層
            const body = document.getElementById('app-body');
            body.className = `min-h-screen bg-gradient-to-br transition-colors duration-1000 ease-in-out font-sans flex flex-col ${gradientBackgrounds[data.theme]}`;

            // 2. 更新照片與文字
            const imgEl = document.getElementById('day-image');
            
            // 重新觸發淡入動畫
            const imgContainer = document.getElementById('image-container');
            imgContainer.classList.remove('animate-fade-in');
            void imgContainer.offsetWidth; // trigger reflow
            imgContainer.classList.add('animate-fade-in');

            imgEl.src = data.image;
            document.getElementById('day-badge').innerText = `${data.date} • ${data.location}`;
            document.getElementById('day-title').innerText = data.title;
            document.getElementById('day-guide').innerText = data.guide;
            document.getElementById('day-stay').innerText = data.stay;
            document.getElementById('day-time').innerText = data.time;
            document.getElementById('day-activity').innerText = data.activity;
            document.getElementById('day-note').innerText = data.note;

            // 3. 更新卡片風格
            document.getElementById('info-card').className = `p-6 rounded-3xl backdrop-blur-md border shadow-xl transition-all duration-500 ${themeColors[data.theme]}`;

            // 4. 地圖飛躍與標記移動
            if (map && marker) {
                map.flyTo(data.coords, 10, { animate: true, duration: 1.5 });
                marker.setLatLng(data.coords);
            }
        }
    </script>
</body>
</html>

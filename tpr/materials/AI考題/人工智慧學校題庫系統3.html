<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIATCL 30題互動模擬測驗</title>
<style>
:root{--bg:#08111f;--panel:#0e1b2f;--text:#eef6ff;--muted:#a9b8c9;--accent:#28d9c7;--accent2:#7c5cff;--warning:#f5b400;--danger:#ff647c;--ok:#2ee59d;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07)}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:radial-gradient(circle at top left,#17365f 0,#08111f 45%,#050914 100%);color:var(--text);line-height:1.65}
header{padding:42px 6vw 28px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(40,217,199,.16),rgba(124,92,255,.12),transparent)}h1{font-size:clamp(28px,4vw,46px);margin:0 0 10px;font-weight:850}.subtitle{font-size:18px;color:var(--muted);max-width:980px}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.06);padding:8px 12px;border-radius:999px;color:#d9f8ff;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:24px;padding:28px 6vw}.sidebar{position:sticky;top:16px;align-self:start;background:rgba(14,27,47,.9);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(12px)}.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.metric b{display:block;font-size:28px;color:var(--accent)}.metric span{color:var(--muted);font-size:13px}.bar{height:12px;background:#1b2d47;border-radius:999px;overflow:hidden;margin:14px 0}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.4s}.btn{width:100%;border:0;border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:750;cursor:pointer;color:#06101d;background:var(--accent);font-size:15px}.btn.secondary{background:#233955;color:var(--text);border:1px solid var(--line)}.btn.warn{background:var(--warning);color:#1b1300}.note{font-size:13px;color:var(--muted);margin-top:14px}
.question{background:rgba(14,27,47,.84);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 12px 34px rgba(0,0,0,.22)}.question.correct{border-color:rgba(46,229,157,.6)}.question.wrong{border-color:rgba(255,100,124,.7)}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tag{font-size:12px;color:#052019;background:var(--accent);border-radius:999px;padding:4px 10px;font-weight:800;white-space:nowrap}.stem{font-size:18px;font-weight:760;margin:8px 0 14px}.scenario{background:rgba(255,255,255,.05);border-left:4px solid var(--accent2);padding:13px 15px;border-radius:12px;color:#d7e7ff;margin:10px 0 14px}.options{display:grid;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045);cursor:pointer}.option:hover{border-color:rgba(40,217,199,.55)}.option input{margin-top:6px;transform:scale(1.15)}.option.good{background:rgba(46,229,157,.14);border-color:rgba(46,229,157,.65)}.option.bad{background:rgba(255,100,124,.14);border-color:rgba(255,100,124,.6)}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.feedback.show{display:block}.feedback b{color:var(--accent)}.mini{color:var(--muted);font-size:14px}.summary{display:none;background:linear-gradient(135deg,rgba(40,217,199,.16),rgba(124,92,255,.12));border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.summary.show{display:block}.sectionTitle{margin:0 0 16px;font-size:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reviewList{padding-left:20px}.hiddenWrong .question.correct{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative}.grid2,.scorebox{grid-template-columns:1fr}}
@media print{body{background:white;color:black}.sidebar,.btn{display:none}.question,.summary{break-inside:avoid;border:1px solid #aaa;background:white;color:black}.subtitle,.mini{color:#333}}
</style>
</head>
<body>
<header><h1>AIATCL 素養認證｜30題互動模擬測驗</h1><div class="subtitle">依據「人工智慧概念、機器學習、深度學習、遷移學習、雲端／邊緣運算、生成式 AI、AI 輔助數位孿生、人工智慧安全」等課程重點設計，並參考預試卷的單選、多選、閱讀題組結構。</div><div class="pillrow"><span class="pill">15 題單選 × 2.5 分</span><span class="pill">5 題多選 × 2.5 分</span><span class="pill">10 題題組 × 5 分</span><span class="pill">總分 100｜建議 50 分鐘</span></div></header>
<div class="layout"><aside class="sidebar"><h2 style="margin:0 0 12px">作答儀表板</h2><div class="scorebox"><div class="metric"><b id="answered">0</b><span>已作答 / 30</span></div><div class="metric"><b id="score">--</b><span>總分 / 100</span></div></div><div class="bar"><i id="progress"></i></div><button class="btn" onclick="gradeQuiz()">交卷並顯示解析</button><button class="btn secondary" onclick="toggleWrongOnly()">只複習錯題</button><button class="btn secondary" onclick="showAllQuestions()">顯示全部題目</button><button class="btn warn" onclick="resetQuiz()">重新作答</button><button class="btn secondary" onclick="window.print()">列印／另存 PDF</button><div class="note">多選題採「比例得分且錯選扣抵」：選對越多分數越高，錯選會扣分，最低 0 分。</div></aside><main id="app"><div id="summary" class="summary"></div><h2 class="sectionTitle">一、單選題</h2><div id="single"></div><h2 class="sectionTitle">二、多重選擇題</h2><div id="multi"></div><h2 class="sectionTitle">三、閱讀題組</h2><div id="case"></div></main></div>
<script>
const questions = [{"type": "single", "topic": "AI 概念", "pts": 2.5, "q": "從「規則驅動」走向「資料驅動」最能說明 AI 時代的哪一項特徵？", "opts": ["所有決策都由工程師預先寫成固定規則", "系統可從資料中學習模式並形成判斷依據", "電腦只負責儲存資料，不參與推論", "AI 只適用於重複性的機械動作"], "ans": [1], "exp": "AI 時代的重要轉變是讓模型從資料中歸納規則，而不是完全依賴人工撰寫規則。", "ext": "延伸：比較專家系統、機器學習與生成式 AI 在「規則來源」上的差異。"}, {"type": "single", "topic": "AI 歷程", "pts": 2.5, "q": "圖靈測試主要用來討論下列哪一個問題？", "opts": ["機器能否被人類從對話中辨識出來", "機器是否具有足夠的儲存容量", "模型能否在雲端部署", "資料是否完成去識別化"], "ans": [0], "exp": "圖靈測試以問答互動檢驗判斷者能否分辨人與機器。", "ext": "延伸：討論「表現得像會思考」與「真的具有意識」的差異。"}, {"type": "single", "topic": "弱 AI / 強 AI", "pts": 2.5, "q": "下列何者最符合「弱人工智慧」的描述？", "opts": ["具備通用理解與自我意識", "可在特定任務中表現良好，但無法泛化到所有人類任務", "可不需資料即可推論所有問題", "一定能通過咖啡測試"], "ans": [1], "exp": "弱 AI 又稱狹隘人工智慧，通常在特定任務中有效。", "ext": "延伸：用影像辨識、語音辨識與推薦系統比較不同任務範圍。"}, {"type": "single", "topic": "機器學習定義", "pts": 2.5, "q": "機器學習最核心的定義是什麼？", "opts": ["讓電腦依照人工寫好的每一條規則執行", "讓模型從過去資料學習規律，進而預測或判斷新資料", "讓硬體設備變得更省電", "讓資料庫查詢速度變快"], "ans": [1], "exp": "機器學習強調從資料學習規律，並用於推論階段的新資料。", "ext": "延伸：可將訓練資料比喻成教材，新資料比喻成考題。"}, {"type": "single", "topic": "資料型態", "pts": 2.5, "q": "下列哪一項最可能屬於結構化資料？", "opts": ["一段課堂錄音", "一張無標註照片", "Excel 表格中的學生學號、成績與出席次數", "一篇自由書寫的心得文章"], "ans": [2], "exp": "結構化資料通常可以用表格欄列清楚表示。", "ext": "延伸：JSON、XML 可視為半結構化；文字、影像、音訊常屬非結構化。"}, {"type": "single", "topic": "資料品質", "pts": 2.5, "q": "「Garbage in, garbage out」在 AI 專案中提醒我們什麼？", "opts": ["資料品質會直接影響模型學習結果", "模型越大就越不需要資料", "只要資料量大就一定正確", "AI 系統不需要驗證資料"], "ans": [0], "exp": "若輸入資料錯誤、有偏或品質低落，模型也可能產生不可靠結果。", "ext": "延伸：可設計資料清理、標註品質檢查與偏誤檢測流程。"}, {"type": "single", "topic": "監督式學習", "pts": 2.5, "q": "用已標記的貓狗照片訓練模型，讓模型判斷新照片是貓或狗，屬於哪一類任務？", "opts": ["分類任務", "迴歸任務", "分群任務", "降維任務"], "ans": [0], "exp": "預測離散類別如貓／狗、正常／異常，屬於分類任務。", "ext": "延伸：分類任務常見指標包含 Accuracy、Precision、Recall 與 F1-score。"}, {"type": "single", "topic": "迴歸任務", "pts": 2.5, "q": "預測明日最高氣溫、房價或作物產量，最接近哪一種機器學習任務？", "opts": ["聚類", "迴歸", "文本生成", "物件偵測"], "ans": [1], "exp": "預測連續數值通常屬於迴歸任務。", "ext": "延伸：迴歸可搭配 MAE、RMSE 等指標評估預測誤差。"}, {"type": "single", "topic": "非監督式學習", "pts": 2.5, "q": "在沒有標籤的顧客資料中，依消費行為自動分出不同族群，最適合哪一類方法？", "opts": ["強化學習", "分群", "二元分類", "語音辨識"], "ans": [1], "exp": "沒有標準答案標籤、依特徵相似度分組，典型上屬於非監督式分群。", "ext": "延伸：常見分群演算法包含 K-means、DBSCAN。"}, {"type": "single", "topic": "訓練與推論", "pts": 2.5, "q": "模型已完成訓練後，拿一筆從未看過的新資料進行預測，稱為什麼階段？", "opts": ["資料清理階段", "推論階段", "標註階段", "資料蒐集階段"], "ans": [1], "exp": "訓練階段是模型學習；推論階段是模型對新資料產生預測。", "ext": "延伸：部署後仍需監測推論品質，避免資料分布改變造成效能下降。"}, {"type": "single", "topic": "泛化能力", "pts": 2.5, "q": "模型在訓練資料表現極佳，但遇到新資料表現很差，最可能是什麼問題？", "opts": ["資料去識別化", "過度擬合", "邊緣運算", "資料壓縮"], "ans": [1], "exp": "過度擬合代表模型過度記住訓練資料細節，泛化能力不足。", "ext": "延伸：可透過增加資料、簡化模型、正則化、交叉驗證降低過擬合。"}, {"type": "single", "topic": "深度學習", "pts": 2.5, "q": "深度學習通常指的是使用下列哪一類模型？", "opts": ["深度神經網路", "純手工規則表", "傳統試算表公式", "資料庫索引"], "ans": [0], "exp": "深度學習是機器學習的一個子領域，主要以多層神經網路進行特徵學習。", "ext": "延伸：影像、語音、自然語言任務常使用深度學習方法。"}, {"type": "single", "topic": "CNN", "pts": 2.5, "q": "若要從照片中辨識植物葉片是否有病斑，下列哪一種深度學習架構最常見？", "opts": ["CNN 卷積神經網路", "K-means", "線性迴歸", "Apriori 關聯規則"], "ans": [0], "exp": "CNN 擅長處理影像中的局部特徵，如邊緣、紋理、形狀與物件區域。", "ext": "延伸：比較影像分類、物件偵測與影像分割。"}, {"type": "single", "topic": "遷移學習", "pts": 2.5, "q": "將已在大量人臉資料訓練好的模型，微調後用於公司門禁辨識，最符合哪一概念？", "opts": ["聯邦學習", "遷移學習", "資料庫正規化", "強化學習"], "ans": [1], "exp": "遷移學習是將某任務已學到的知識移用到相關任務，並用少量資料微調。", "ext": "延伸：預訓練模型可降低訓練成本並改善小資料情境。"}, {"type": "single", "topic": "雲端與邊緣 AI", "pts": 2.5, "q": "邊緣 AI 與雲端 AI 最主要的差異是什麼？", "opts": ["資料格式不同", "運算位置不同：邊緣在裝置或近端，雲端在遠端資料中心", "邊緣 AI 不能處理感測資料", "雲端 AI 不需要網路"], "ans": [1], "exp": "邊緣 AI 強調在裝置端或近端運算，可降低延遲並提升隱私；雲端 AI 利於集中式大量運算。", "ext": "延伸：自駕車、智慧攝影機與穿戴裝置常需要邊緣推論。"}, {"type": "multi", "topic": "資料倫理", "pts": 2.5, "q": "AI 專案收集與使用資料時，下列哪些屬於重要倫理原則？", "opts": ["資料去識別化", "取得使用者同意並提高透明度", "公平性與避免偏見", "資料安全保護", "只要模型準確即可忽略隱私"], "ans": [0, 1, 2, 3], "exp": "資料倫理包含隱私保護、同意與透明、公平性、資料安全與負責任分享。", "ext": "延伸：可建立資料治理表，記錄資料來源、用途、權限與保存期限。"}, {"type": "multi", "topic": "機器學習型態", "pts": 2.5, "q": "依資料是否有標籤與回饋機制，常見機器學習型態包含哪些？", "opts": ["監督式學習", "非監督式學習", "半監督式學習", "強化式學習", "手動複製學習"], "ans": [0, 1, 2, 3], "exp": "常見類型包含監督式、非監督式、半監督式與強化式學習。", "ext": "延伸：用「有標籤／無標籤／部分有標籤／獎懲回饋」建立比較表。"}, {"type": "multi", "topic": "深度學習架構", "pts": 2.5, "q": "下列哪些可視為常見深度學習或神經網路相關架構？", "opts": ["CNN", "RNN / LSTM", "Transformer", "GAN", "K-means"], "ans": [0, 1, 2, 3], "exp": "CNN、RNN/LSTM、Transformer、GAN 都屬神經網路相關架構；K-means 是傳統分群演算法。", "ext": "延伸：Transformer 是大型語言模型的重要基礎架構。"}, {"type": "multi", "topic": "生成式 AI", "pts": 2.5, "q": "使用生成式 AI 時，下列哪些做法較能提升輸出品質？", "opts": ["明確說明任務、角色與限制", "提供必要背景資料或範例", "完全不檢查 AI 生成內容", "搭配檢索增強生成補足可信知識來源", "要求模型在不確定時說明限制"], "ans": [0, 1, 3, 4], "exp": "良好提示、背景脈絡、檢索資料與不確定性揭露，都能提升生成式 AI 的可靠性。", "ext": "延伸：比較 Prompt Engineering、RAG 與微調。"}, {"type": "multi", "topic": "AI 安全", "pts": 2.5, "q": "下列哪些是提高 AI 系統安全與可信任度的做法？", "opts": ["監控模型效能與漂移", "測試偏見與公平性", "加強隱私與存取控制", "只追求最高準確率，不檢查錯誤案例", "提升可解釋性與人類監督"], "ans": [0, 1, 2, 4], "exp": "AI 安全包含監控、偏誤檢測、隱私保護、可解釋性與人類監督。", "ext": "延伸：AI 安全是技術、治理、倫理與組織流程的整合議題。"}, {"type": "case", "topic": "題組 A：校園智慧客服", "pts": 5, "scenario": "某大學希望建立 AI 校園客服，回答學生對選課、學分、請假、畢業門檻等問題。系統連接校內規章與 FAQ 知識庫，並以生成式 AI 產生自然語言回覆。", "q": "為降低模型「編造答案」的風險，最適合導入哪一種方法？", "opts": ["RAG 檢索增強生成", "影像分割", "K-means 分群", "梯度提升樹只做數值預測"], "ans": [0], "exp": "RAG 先從知識庫檢索相關資料，再讓模型依據內容生成回答，可降低缺乏依據的幻覺風險。", "ext": "延伸：校園客服應顯示來源段落與更新日期。"}, {"type": "case", "topic": "題組 A：校園智慧客服", "pts": 5, "scenario": "延續上題，校園客服需處理學生個人資料，例如學籍、修課紀錄與輔導紀錄。", "q": "系統上線前，哪一項治理措施最重要？", "opts": ["公開所有學生原始資料供模型學習", "限制權限、去識別化並記錄資料使用目的", "只增加回答速度，不處理隱私問題", "把所有資料永久保存"], "ans": [1], "exp": "涉及個人資料時，需採取權限控管、去識別化、目的限制與安全稽核。", "ext": "延伸：建立資料分級制度，區分公開資料、校內資料、敏感個資與不可上傳資料。"}, {"type": "case", "topic": "題組 B：智慧農業", "pts": 5, "scenario": "農業團隊使用衛星影像與無人機照片判斷作物是否出現病害，並以歷史產量、氣象與土壤資料預測收成。", "q": "以影像判斷葉片是否有病害，若每張影像都有「健康／感染」標籤，最接近哪一類學習？", "opts": ["監督式分類", "非監督式分群", "強化式學習", "資料庫查詢"], "ans": [0], "exp": "有標籤且要預測類別，屬於監督式分類任務。", "ext": "延伸：若要標出病斑位置，可使用物件偵測或影像分割。"}, {"type": "case", "topic": "題組 B：智慧農業", "pts": 5, "scenario": "同一套智慧農業系統想要根據土壤酸鹼值、有機質、含水量與導電度，把相似農地分在同一群。", "q": "此任務最適合哪一種方法？", "opts": ["分群分析", "語音辨識", "文本生成", "二元分類"], "ans": [0], "exp": "依特徵相似度自動分組，且沒有預設正確標籤，屬於分群分析。", "ext": "延伸：分群後可制定差異化灌溉與施肥策略。"}, {"type": "case", "topic": "題組 C：文化典藏數位孿生", "pts": 5, "scenario": "博物館建置蘭嶼生態與文化數位典藏平台，整合植物、地景、口述歷史、步道位置與 XR 展示，並希望建立可模擬環境變化的數位孿生。", "q": "在此情境中，「AI 輔助數位孿生」最核心的價值是什麼？", "opts": ["只把資料做成漂亮海報", "整合真實資料、模型與互動展示，支援理解、預測與決策", "完全取代地方知識與口述歷史", "只做靜態網頁，不需要更新"], "ans": [1], "exp": "數位孿生強調以資料與模型映射真實系統，並可進行監測、模擬與互動。", "ext": "延伸：可將地理資料、感測資料與知識圖譜整合，支援 XR 導覽與教育應用。"}, {"type": "case", "topic": "題組 C：文化典藏數位孿生", "pts": 5, "scenario": "團隊要把民俗植物知識、地理位置、照片、採集紀錄與口述故事連結起來，形成可查詢的知識網絡。", "q": "下列哪一項最能支援「知識之間的關聯查詢」？", "opts": ["知識圖譜", "單一圖片壓縮檔", "純文字亂數命名資料夾", "只用紙本問卷保存"], "ans": [0], "exp": "知識圖譜能描述實體與關係，例如植物、地點、用途、族語名稱、故事與影像之間的連結。", "ext": "延伸：加入語意標準與資料品質規則，使資料更容易交換、查詢與再利用。"}, {"type": "case", "topic": "題組 D：自駕與邊緣 AI", "pts": 5, "scenario": "自駕車需要即時辨識行人、車道線與交通號誌，若每次影像都送到遠端雲端再回傳，可能造成延遲。", "q": "此情境較適合哪一種部署方式？", "opts": ["邊緣 AI 即時推論", "只用紙本地圖", "完全離線但不使用模型", "把所有感測器關閉"], "ans": [0], "exp": "自駕任務需要低延遲與即時反應，因此常在車端或近端進行邊緣推論。", "ext": "延伸：雲端可負責模型訓練、資料彙整與版本更新；邊緣端負責即時推論。"}, {"type": "case", "topic": "題組 D：自駕與邊緣 AI", "pts": 5, "scenario": "自駕系統要在影像中框出路上的行人與交通標誌。", "q": "這屬於哪一類電腦視覺任務？", "opts": ["物件偵測", "文章摘要", "機器翻譯", "語音合成"], "ans": [0], "exp": "物件偵測不只判斷影像中有什麼，也要定位物件位置，通常以框線表示。", "ext": "延伸：影像分類回答「有什麼」，物件偵測回答「在哪裡」，影像分割做到像素級區域。"}, {"type": "case", "topic": "題組 E：醫療 AI", "pts": 5, "scenario": "醫院以 X 光影像建立輔助診斷模型，資料中包含病人影像與醫師標註結果。", "q": "若模型只在訓練醫院資料表現好，換到另一家醫院資料表現變差，最需要檢查什麼？", "opts": ["模型泛化能力與資料分布差異", "螢幕解析度是否足夠美觀", "病人是否喜歡 AI 名稱", "是否使用更多動畫效果"], "ans": [0], "exp": "不同醫院的設備、族群與流程可能造成資料分布差異，影響模型泛化能力。", "ext": "延伸：醫療 AI 應進行外部驗證、偏誤分析與臨床風險評估。"}, {"type": "case", "topic": "題組 E：醫療 AI", "pts": 5, "scenario": "同一醫療模型需向醫師說明哪些影像區域影響判斷，以協助臨床審閱。", "q": "此需求主要對應 AI 的哪一項能力？", "opts": ["可解釋性", "資料壓縮", "網頁 SEO", "遊戲化排名"], "ans": [0], "exp": "可解釋性關注模型決策依據是否能被人理解，特別適合高風險領域。", "ext": "延伸：可用熱區圖、特徵重要性或反事實說明輔助專業人員判讀。"}];
const labels=['Ａ','Ｂ','Ｃ','Ｄ','Ｅ'];
function render(){
  const groups={single:document.getElementById('single'), multi:document.getElementById('multi'), case:document.getElementById('case')};
  Object.values(groups).forEach(g=>g.innerHTML='');
  questions.forEach((item,i)=>{
    const div=document.createElement('div'); div.className='question'; div.id='q'+i;
    const inputType=item.type==='multi'?'checkbox':'radio';
    div.innerHTML=`<div class="qhead"><div><span class="mini">第 ${i+1} 題｜${item.type==='single'?'單選':item.type==='multi'?'多選':'題組'}｜${item.pts} 分</span><div class="stem">${item.q}</div></div><span class="tag">${item.topic}</span></div>${item.scenario?`<div class="scenario">${item.scenario}</div>`:''}<div class="options">${item.opts.map((o,idx)=>`<label class="option" data-q="${i}" data-idx="${idx}"><input type="${inputType}" name="q${i}" value="${idx}" onchange="updateAnswered()"><span>(${labels[idx]}) ${o}</span></label>`).join('')}</div><div class="feedback" id="fb${i}"><b>正確答案：${item.ans.map(a=>labels[a]).join('、')}</b><br>${item.exp}<br><span class="mini">${item.ext}</span></div>`;
    groups[item.type].appendChild(div);
  }); updateAnswered();
}
function selected(i){return [...document.querySelectorAll(`input[name=q${i}]:checked`)].map(x=>Number(x.value));}
function updateAnswered(){let c=0;questions.forEach((_,i)=>{if(selected(i).length)c++});document.getElementById('answered').textContent=c;document.getElementById('progress').style.width=(c/questions.length*100)+'%';}
function scoreQuestion(q, sel){ const ans=q.ans; if(q.type==='multi'){ const correctSel=sel.filter(x=>ans.includes(x)).length; const wrongSel=sel.filter(x=>!ans.includes(x)).length; const wrongTotal=q.opts.length-ans.length; return Math.max(0,(correctSel/ans.length)-(wrongTotal?wrongSel/wrongTotal:0))*q.pts; } return sel.length===1 && sel[0]===ans[0] ? q.pts : 0; }
function gradeQuiz(){ let total=0, correct=0, missed=[]; questions.forEach((q,i)=>{ const sel=selected(i), pts=scoreQuestion(q,sel); total+=pts; const qdiv=document.getElementById('q'+i); qdiv.classList.remove('correct','wrong'); const isFull=Math.abs(pts-q.pts)<0.001; if(isFull) correct++; else missed.push(i+1); qdiv.classList.add(isFull?'correct':'wrong'); qdiv.querySelectorAll('.option').forEach(opt=>{opt.classList.remove('good','bad'); const idx=Number(opt.dataset.idx); if(q.ans.includes(idx)) opt.classList.add('good'); if(sel.includes(idx)&&!q.ans.includes(idx)) opt.classList.add('bad');}); document.getElementById('fb'+i).classList.add('show'); }); total=Math.round(total*10)/10; document.getElementById('score').textContent=total; const level=total>=80?'通過標準':'尚未達通過標準'; const advice=total>=90?'可進一步挑戰情境題與延伸應用。':total>=80?'建議複習錯題解析，強化多選題與題組判斷。':total>=60?'建議先重讀機器學習型態、深度學習、生成式 AI 與 AI 安全。':'建議依章節重新學習基本概念，再進行第二次作答。'; const s=document.getElementById('summary'); s.classList.add('show'); s.innerHTML=`<h2>測驗結果：${total} / 100（${level}）</h2><div class="grid2"><div><b>完整得分題數：</b>${correct} / ${questions.length}</div><div><b>需複習題號：</b>${missed.length?missed.join('、'):'無'}</div></div><p>${advice}</p><ol class="reviewList"><li>先看錯題解析中的核心概念。</li><li>再看延伸學習，將題目連回課程章節。</li><li>最後重新作答一次，必要時只保留錯題複習。</li></ol>`; window.scrollTo({top:0,behavior:'smooth'}); }
function toggleWrongOnly(){document.body.classList.add('hiddenWrong');} function showAllQuestions(){document.body.classList.remove('hiddenWrong');} function resetQuiz(){document.querySelectorAll('input').forEach(i=>i.checked=false);document.querySelectorAll('.question').forEach(q=>{q.classList.remove('correct','wrong');q.querySelectorAll('.option').forEach(o=>o.classList.remove('good','bad'));});document.querySelectorAll('.feedback').forEach(f=>f.classList.remove('show'));document.getElementById('summary').classList.remove('show');document.getElementById('score').textContent='--';showAllQuestions();updateAnswered();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>

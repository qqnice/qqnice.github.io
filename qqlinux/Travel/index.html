                stay: "布萊德湖區或博希尼湖區周邊",
                highlight: "搭 Vogel 纜車直達海拔 1535 公尺享受 360 度群峰視野。隨後步行探訪森林中的薩維察瀑布 (Savica Waterfall)。",
                food: "湖畔鄉村小館享用阿爾卑斯山區傳統燉肉與熱湯。",
                tips: "瀑布健行皆為階梯 (單程20分)，穿防滑運動鞋。"
            },
            {
                day: 36, date: "8/8 (六)", phase: 3, group: "兩人專屬",
                title: "迎戰 50 個髮夾彎大魔王", location: "Vršič Pass & Bovec",
                mapQuery: "Vrsic Pass", keyword: "vrsic,mountainroad",
                time: "湖區 ➔ Vršič Pass ➔ 博韋茨 Bovec",
                stay: "博韋茨 (Bovec) 或 科巴里德 (Kobarid) 附近",
                highlight: "挑戰斯國最高公路！途經倒影如鏡的亞斯娜湖、Vršič 最高點。下山欣賞藍綠色「翡翠河」。",
                food: "翻越山嶺抵達 Bovec 後，品嚐在地手工起司與冷盤慰勞駕駛辛勞。",
                tips: "【極度重要】下坡請切低速檔，全程利用「引擎煞車」滑行，嚴禁長時間重踩煞車！"
            },
            {
                day: 37, date: "8/9 (日)", phase: 3, group: "兩人專屬",
                title: "沉浸在翡翠河谷的芬多精", location: "Tolmin Gorges (托爾明)",
                mapQuery: "Tolmin Gorges", keyword: "tolmin,gorges",
                time: "博韋茨 ➔ 托爾明峽谷",
                stay: "托爾明 (Tolmin) 周邊",
                highlight: "沿著翠綠色 Soča 景觀公路南下。漫步托爾明峽谷岩壁木棧道，吸收森林芬多精。",
                food: "午餐尋找河岸餐廳，品嚐奶油乾煎的當地特產「索查河鱒魚 (Soča Trout)」。",
                tips: "此段公路平緩好開，終於可以放慢車速輕鬆享受風景。"
            },
            {
                day: 38, date: "8/10 (一)", phase: 3, group: "兩人專屬",
                title: "汽車火車穿越大山", location: "Škofja Loka (什科菲亞洛卡)",
                mapQuery: "Skofja Loka", keyword: "skofjaloka,town",
                time: "Tolmin ➔ 汽車火車(Motorail) ➔ Škofja Loka",
                stay: "什科菲亞洛卡 (Škofja Loka)",
                highlight: "【超級高光】中午把車開上火車平車廂，坐在車內穿越 6 公里黑暗山洞！下午抵達擁有石橋與古城的中世紀老鎮。",
                food: "在古城廣場旁找間復古餐館，享用斯洛維尼亞傳統烤肉晚餐。",
                tips: "汽車火車無法預約！旺季請務必提早 40 分鐘抵達 Most na Soči 車站排隊。"
            },
            {
                day: 39, date: "8/11 (二)", phase: 3, group: "兩人專屬",
                title: "首都巡禮與啟程返台", location: "Ljubljana ➔ Istanbul",
                mapQuery: "Ljubljana Airport", keyword: "ljubljana,airport",
                time: "土航 TK 1064 (20:15 出發 ➔ 23:40 抵達)",
                stay: "機上",
                highlight: "白天完成市區還車與首都巡禮。傍晚前往機場，搭乘晚間班機離開盧比安納 (飛行 2h25m)。在伊斯坦堡停留 1h50m 轉機。",
                food: "白天在河畔景觀餐廳享用午餐，晚餐可於機場或機上享用。",
                tips: "確認編號：SJFDNH。記得保留最後加油收據。使用 Bolt 叫車前往機場，價格透明。"
            },
            {
                day: 40, date: "8/12 (三)", phase: 3, group: "完美歸來",
                title: "抵達溫暖的家", location: "Istanbul ➔ Taipei",
                mapQuery: "Taoyuan International Airport", keyword: "taiwan,home",
                time: "土航 TK 24 (01:30 出發 ➔ 17:55 抵達)",
                stay: "溫暖的家",
                highlight: "凌晨從伊斯坦堡起飛 (飛行 11h25m)。帶著 40 天橫跨四國、滿滿的歐陸回憶與數千張絕美照片，平安降落台灣桃園機場。史詩壯遊，完美落幕！",
                food: "機上餐點與令人懷念的台灣家鄉味",
                tips: "確認編號：SJFDNH。好好休息，準備回家整理這趟壯遊的珍貴回憶與照片。"
            }
        ];

        let currentIndex = 0;
        let currentPhase = 1;

        // Theme colors logic
        const themes = {
            1: { name: 'amber', 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e' },
            2: { name: 'blue', 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af' },
            3: { name: 'emerald', 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46' }
        };

        const phaseDetails = {
            1: { title: "第一章：中歐經典與波希米亞童話", desc: "四人專屬：完美結合大眾運輸與專車接駁，走過百塔之城布拉格、童話小鎮庫倫洛夫，與奧地利湖區秘境。" },
            2: { title: "第二章：亞得里亞海蔚藍情詩", desc: "兩人自駕：精準避開人潮，馳騁最美 D8 海岸線，從羅維尼的夕陽到君臨城的古牆，最終潛入十六湖的森林秘境。" },
            3: { title: "第三章：阿爾卑斯翡翠之Love", desc: "兩人自駕：在盧比安納的學術交流後，挑戰最高公路髮夾彎，並體驗把汽車開上火車的奇幻旅程。" }
        };

        function init() {
            renderTimeline();
            updateDetailCard();
            updateTheme();
        }

        function renderTimeline() {
            const container = document.getElementById('topTimelineNodes');
            container.innerHTML = '';
            
            itineraryData.forEach((data, index) => {
                const nodeBtn = document.createElement('button');
                nodeBtn.className = `relative flex flex-col items-center group focus:outline-none px-4`;
                nodeBtn.onclick = () => selectDay(index);
                
                const isPastOrCurrent = index <= currentIndex;
                const isCurrent = index === currentIndex;
                
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 md:w-5 md:h-5 rounded-full border-4 transition-all duration-300 z-10 bg-white cursor-pointer
                                ${isPastOrCurrent ? 'border-theme-500' : 'border-slate-200'}
                                ${isCurrent ? 'scale-[1.4] shadow-lg bg-theme-100' : 'hover:scale-110'}
                                `;
                
                const label = document.createElement('div');
                label.className = `absolute top-8 text-[10px] md:text-xs font-bold whitespace-nowrap transition-colors duration-300
                                  ${isCurrent ? 'text-theme-600' : 'text-slate-400 group-hover:text-theme-500'}`;
                label.innerText = `D${data.day}`;

                const phaseMarker = document.createElement('div');
                phaseMarker.className = `absolute -top-6 text-[10px] font-bold text-slate-300 whitespace-nowrap ${index === 0 || itineraryData[index].phase !== itineraryData[index-1].phase ? 'block' : 'hidden'}`;
                phaseMarker.innerText = `Phase ${data.phase}`;
                
                nodeBtn.appendChild(phaseMarker);
                nodeBtn.appendChild(dot);
                nodeBtn.appendChild(label);
                container.appendChild(nodeBtn);
            });
            
            const progressLine = document.getElementById('topProgressLine');
            if (itineraryData.length > 1) {
                const percentage = (currentIndex / (itineraryData.length - 1)) * 100;
                progressLine.style.width = `${percentage}%`; 
            }
        }

        function selectDay(index) {
            if (index === currentIndex) return;
            currentIndex = index;
            
            const newPhase = itineraryData[currentIndex].phase;
            if(newPhase !== currentPhase) {
                currentPhase = newPhase;
                updateTheme();
            }

            renderTimeline();
            updateDetailCard();
            
            // Auto scroll timeline to center
            const topContainer = document.getElementById('timelineScrollBox');
            const activeTopNode = document.getElementById('topTimelineNodes').children[index];
            if(topContainer && activeTopNode) {
                const scrollLeft = activeTopNode.offsetLeft - (topContainer.clientWidth / 2) + (activeTopNode.clientWidth / 2);
                topContainer.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
        }

        function jumpToPhase(phaseNumber) {
            const targetIndex = itineraryData.findIndex(d => d.phase === phaseNumber);
            if(targetIndex !== -1) {
                selectDay(targetIndex);
            }
        }

        function updateTheme() {
            const root = document.documentElement;
            const theme = themes[currentPhase];
            
            root.style.setProperty('--theme-50', theme[50]);
            root.style.setProperty('--theme-100', theme[100]);
            root.style.setProperty('--theme-500', theme[500]);
            root.style.setProperty('--theme-600', theme[600]);
            root.style.setProperty('--theme-700', theme[700]);
            root.style.setProperty('--theme-800', theme[800]);

            // Update Tab Opacities
            [1, 2, 3].forEach(p => {
                const tab = document.getElementById(`tab-phase-${p}`);
                if(p === currentPhase) {
                    tab.classList.remove('opacity-50');
                    tab.classList.add('shadow-md', 'scale-105');
                } else {
                    tab.classList.add('opacity-50');
                    tab.classList.remove('shadow-md', 'scale-105');
                }
            });

            document.getElementById('phaseTitle').innerText = phaseDetails[currentPhase].title;
            document.getElementById('phaseDesc').innerText = phaseDetails[currentPhase].desc;
        }

        function fetchSafeImage(keyword, fallbackSeedText) {
            return new Promise((resolve) => {
                const img = new Image();
                const randomId = Math.floor(Math.random() * 10000);
                img.src = `https://loremflickr.com/1200/800/${keyword}?random=${randomId}`;
                img.onload = () => resolve(img.src);
                img.onerror = () => resolve(`https://picsum.photos/seed/${fallbackSeedText}${randomId}/1200/800`);
                setTimeout(() => resolve(`https://picsum.photos/seed/timeout${randomId}/1200/800`), 6000);
            });
        }

        async function updateDetailCard() {
            const data = itineraryData[currentIndex];
            const contentGrid = document.getElementById('contentGrid');
            const imgEl = document.getElementById('heroImage');
            const imgContainer = document.getElementById('imageContainer');
            const mapIframe = document.getElementById('googleMap');
            
            contentGrid.style.opacity = '0.3';
            mapIframe.classList.add('opacity-0');
            
            imgEl.classList.remove('opacity-100');
            imgEl.classList.add('opacity-0');
            imgContainer.classList.add('skeleton');

            setTimeout(() => {
                document.getElementById('cardDay').innerText = `Day ${data.day}`;
                document.getElementById('cardDate').innerText = data.date;
                document.getElementById('cardGroup').innerText = data.group;
                document.getElementById('cardTitle').innerText = data.title;
                document.getElementById('cardLocation').querySelector('span').innerText = data.location;
                document.getElementById('cardTime').innerText = data.time;
                document.getElementById('cardStay').innerText = data.stay;
                document.getElementById('cardDining').innerText = data.food;
                document.getElementById('cardHighlight').innerText = data.highlight;
                document.getElementById('cardTips').innerText = data.tips;
                
                // Update Google Map
                const encodedQuery = encodeURIComponent(data.mapQuery);
                mapIframe.src = `https://maps.google.com/maps?q=${encodedQuery}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
                
                contentGrid.style.opacity = '1';
                contentGrid.classList.remove('fade-in');
                void contentGrid.offsetWidth; 
                contentGrid.classList.add('fade-in');
            }, 200);

            mapIframe.onload = () => mapIframe.classList.remove('opacity-0');

            const fallbackStr = data.location.replace(/[^a-zA-Z]/g, ''); 
            const safeImageUrl = await fetchSafeImage(data.keyword, fallbackStr);
            
            imgEl.src = safeImageUrl;
            imgEl.onload = () => {
                imgContainer.classList.remove('skeleton');
                imgEl.classList.remove('opacity-0');
                imgEl.classList.add('opacity-100');
            };
        }

        window.onload = init;
    </script>
</body>
</html>

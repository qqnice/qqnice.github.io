<style>
  /* 專區共用樣式：由各專區頁面以 include 載入。專區主題色由 body 的 class 決定。 */
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1f2933; --muted: #5f6b76;
    --line: #e1e5ea; --code-bg: #f1f3f5; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161a; --card: #1a2027; --ink: #e6eaee; --muted: #9aa6b2;
      --line: #2c343d; --code-bg: #232b34; --warn: #f0b35a;
      color-scheme: dark;
    }
  }
  body.zone-home   { --a: #2563eb; --a-dark: #6aa9ff; }
  body.zone-unreal { --a: #0b6bcb; --a-dark: #5eb0ff; }
  body.zone-tpr    { --a: #0f766e; --a-dark: #4fd1c0; }
  body { --accent: var(--a); }
  @media (prefers-color-scheme: dark) { body { --accent: var(--a-dark); } }
  :root { --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent); }
  body { --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent); }

  * { box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Segoe UI", Tahoma, sans-serif;
    line-height: 1.8; color: var(--ink); background: var(--bg);
    max-width: 920px; margin: 0 auto; padding: 20px 16px 48px;
  }
  .container {
    background: var(--card); padding: 40px 48px; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05); border: 1px solid var(--line);
  }
  @media (max-width: 640px) { .container { padding: 24px 18px; } }
  h1, h2, h3 { color: var(--ink); line-height: 1.35; }
  h1 { border-bottom: 3px solid var(--accent); padding-bottom: 14px; margin: .4em 0 .8em; font-size: 2.1em; }
  h2 { margin-top: 2.2em; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
  h3 { margin-top: 1.6em; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 1.4em; }
  li { margin-bottom: .5em; }
  code, kbd { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: .9em; }
  code { background: var(--code-bg); padding: .1em .4em; border-radius: 4px; }
  kbd { background: var(--code-bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: .05em .45em; white-space: nowrap; }
  pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.6; }
  pre code { background: none; padding: 0; }

  .crumb { font-size: .9em; color: var(--muted); margin-bottom: 6px; }
  .crumb a { font-weight: 400; }
  .lead { font-size: 1.08em; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: .96em; }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--accent-soft); }
  .table-wrap { overflow-x: auto; }

  .callout { border-left: 5px solid var(--accent); background: var(--accent-soft); padding: 12px 18px; border-radius: 6px; margin: 1.2em 0; }
  .callout.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .callout p { margin: .3em 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 1.2em 0; }
  .card {
    display: block; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    color: var(--ink); background: var(--card); font-weight: 400; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); text-decoration: none; }
  .card .tag { font-size: .78em; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
  .card strong { display: block; font-size: 1.1em; margin: 2px 0 6px; }
  .card span.d { display: block; color: var(--muted); font-size: .92em; line-height: 1.6; }

  .file-list-box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 26px; margin-top: 18px; }
  .file-list-box h3 { margin: 0 0 .5em; font-size: 1.05em; }
  .file-list-box ul { list-style: none; padding-left: 0; margin: 0 0 1em; }
  .file-list-box li { margin: 0; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .file-list-box li:last-child { border-bottom: none; }
  .file-list-box .desc { display: block; color: var(--muted); font-size: .88em; font-weight: 400; }
  .file-list-box .empty { color: var(--muted); }

  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .author-box { background: var(--accent-soft); padding: 20px 26px; border-radius: 8px; margin-top: 3em; border-left: 6px solid var(--accent); }
  .author-box h3 { margin-top: 0; }
  .author-box p { margin: .5em 0 0; }
  .sources { font-size: .92em; color: var(--muted); }
  .sources li { margin-bottom: .3em; }
</style>

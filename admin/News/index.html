    const categoryOrder = ["8757", "7698", "7683", "7484", "7486", "7829", "7485"];
    let currentCategoryId = "8757";

    const categoryListEl = document.getElementById("categoryList");
    const articlesContainerEl = document.getElementById("articlesContainer");

    // 初始化左側分類按鈕
    function initCategories() {
      categoryListEl.innerHTML = "";
      categoryOrder.forEach(cid => {
        const cat = announcementData[cid];
        if (!cat) return;

        const li = document.createElement("li");
        li.className = `category-item ${cid === currentCategoryId ? "active" : ""}`;
        li.dataset.cid = cid;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.textContent = cat.name;

        btn.addEventListener("click", () => {
          if (currentCategoryId === cid) return;
          switchCategory(cid);
        });

        li.appendChild(btn);
        categoryListEl.appendChild(li);
      });
    }

    // 切換分類
    function switchCategory(cid) {
      currentCategoryId = cid;

      // 更新按鈕 active 樣式
      document.querySelectorAll(".category-item").forEach(item => {
        if (item.dataset.cid === cid) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });

      // 淡出再載入新資料
      articlesContainerEl.classList.add("fade-out");
      setTimeout(() => {
        renderArticles(cid);
        articlesContainerEl.classList.remove("fade-out");
      }, 100);
    }

    // 渲染右側公告列表
    function renderArticles(cid) {
      articlesContainerEl.innerHTML = "";
      const cat = announcementData[cid];
      if (!cat || !cat.items || cat.items.length === 0) {
        articlesContainerEl.innerHTML = "<p style='color: #888; padding: 20px;'>目前暫無公告</p>";
        return;
      }

      cat.items.forEach((item, index) => {
        const isOdd = (index % 2 === 0); // 視覺上第 1, 3, 5, 7, 9 項 (0-indexed 為偶數)
        
        const itemEl = document.createElement("div");
        itemEl.className = `article-item ${isOdd ? "odd" : "even"}`;

        itemEl.innerHTML = `
          <div class="article-date">${escapeHtml(item.date)}</div>
          <div class="article-title-box">
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="article-link" title="${escapeHtml(item.title)}">
              ${escapeHtml(item.title)}
            </a>
          </div>
        `;

        articlesContainerEl.appendChild(itemEl);
      });
    }

    // 避免 XSS 的 HTML 轉義
    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 初始化頁面
    initCategories();
    renderArticles(currentCategoryId);
  </script>

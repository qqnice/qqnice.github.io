<!DOCTYPE html>
<html lang="zh-Hant" class="font-mode-normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工作應用圖文手冊｜Prompt・Skill・Tool・Agent・Bot 五頁式語音動畫導覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=202610281445" />
</head>
<body class="antialiased selection:bg-sky-500 selection:text-slate-950 min-h-screen flex flex-col">

  <!-- =========================================================================
       頂部常駐控制列：標題 ＋ 字體放大鏡 ＋ 語音開關 ＋ 5 大功能頁面切換標籤
       ========================================================================= -->
  <header class="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-md border-b-2 border-slate-800 shadow-2xl">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <!-- 左側品牌與標題 -->
      <div class="flex items-center gap-3.5">
        <a href="../" class="px-3.5 py-2 rounded-xl hover:bg-slate-800 text-slate-200 text-sm font-black border border-slate-700 transition-colors">
          ← 行政專區
        </a>
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-400 via-emerald-500 to-amber-500 flex items-center justify-center text-2xl shadow-lg shrink-0">
          📘
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2.5">
            <h1 class="font-black text-xl sm:text-2xl tracking-tight text-white">
              AI 工作應用圖文手冊｜五種 AI 工作要素互動導覽
            </h1>
            <span class="hidden lg:inline-flex items-center px-3 py-0.5 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-400/40">
              點選下方 5 個頁面自由切換・含動畫、語音與圖說
            </span>
          </div>
          <!-- 即時語音狀態列 -->
          <div class="flex items-center gap-2 text-xs sm:text-sm text-amber-200 font-bold mt-0.5">
            <span id="speaking-wave" class="hidden items-end gap-0.5 h-3.5 shrink-0">
              <span class="w-1 h-2.5 bg-amber-400 rounded-full sound-bar"></span>
              <span class="w-1 h-3.5 bg-amber-400 rounded-full sound-bar" style="animation-delay:0.15s"></span>
              <span class="w-1 h-2 bg-amber-400 rounded-full sound-bar" style="animation-delay:0.3s"></span>
            </span>
            <span id="voice-status-text" class="truncate max-w-xl sm:max-w-2xl">
              五站是教學順序，並非互斥選項，也不是能力高低排名。點擊任一頁面即可單獨聽語音與看動畫圖解！
            </span>
          </div>
        </div>
      </div>

      <!-- 右側：字體大小切換 ＋ 語音控制 -->
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-700">
          <span class="px-2 text-xs font-bold text-slate-400">字體：</span>
          <button id="btn-font-normal" onclick="setFontSizeMode('normal')" class="px-3 py-1.5 rounded-lg bg-sky-500 text-slate-950 font-black text-sm shadow transition-all">
            標準大字
          </button>
          <button id="btn-font-large" onclick="setFontSizeMode('large')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition-all">
            特大字
          </button>
          <button id="btn-font-xlarge" onclick="setFontSizeMode('xlarge')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition-all">
            投影超大
          </button>
        </div>

        <button id="btn-voice-toggle" onclick="toggleVoiceEnabled()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border-2 border-sky-400 text-sm font-black text-sky-300 transition-all">
          <span id="voice-icon" class="text-lg">🔊</span>
          <span id="voice-label">語音：開啟</span>
        </button>

        <button onclick="speakCurrentPageIntro()" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm shadow transition-all">
          🗣️ 唸本頁導覽
        </button>
      </div>
    </div>

    <!-- =======================================================================
         5 大 AI 功能頁面切換器 (Prompt / Skill / Tool / Agent / Bot + 總覽)
         ======================================================================= -->
    <div class="bg-slate-900/90 border-t border-slate-800">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-8 py-3">
        <div id="five-page-tabs" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-3">
          <!-- 由 JS 渲染 5 個主頁面切換卡 + 1 個總覽卡 -->
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       主頁面內容容器（每次只單獨呈現當前選中的那 1 個頁面，乾淨不雜亂）
       ========================================================================= -->
  <main id="page-main-container" class="max-w-[1440px] mx-auto w-full px-4 sm:px-8 py-7 flex-1">
    <!-- 由 JS 動態渲染當前頁面 (Prompt / Skill / Tool / Agent / Bot / Overview) -->
  </main>

  <!-- 底部精簡頁尾 -->
  <footer class="border-t border-slate-800 bg-slate-950 py-5 text-center text-sm text-slate-400">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div>AI 工作應用圖文手冊｜Prompt・Skill・Tool・Agent・Bot 五頁式互動導覽網站</div>
      <div class="text-slate-500">概念與官方文件查核日：2026 年 10 月 28 日｜先完成一個小任務，再逐步保存方法與增加工具</div>
    </div>
  </footer>

  <script src="data.js?v=202610281445"></script>
  <script src="app.js?v=202610281445"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf2e9">
  <meta name="description" content="跟著 QQ 老師，在 Linux、Unreal、教學實踐研究與行政 AI，以及 YouTube 影音的五座知識島嶼自由探索。">
  <title>QQ 知識海域｜讓好奇心領航</title>
  <link rel="stylesheet" href="assets/islands/style.css">
  <link rel="modulepreload" href="assets/islands/vendor/three.module.js">
  <script type="importmap">{"imports":{"three":"./assets/islands/vendor/three.module.js","three/addons/controls/OrbitControls.js":"./assets/islands/vendor/OrbitControls.js"}}</script>
</head>
<body>
  <a class="skip-link" href="#island-navigation">直接選擇教學專區</a>
  <header class="site-header">
    <a class="brand" href="#" aria-label="QQ 知識海域首頁">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="m26 11-4 12-9 6 4-12z"/><path d="M20 0v5m0 30v5M0 20h5m30 0h5"/></svg>
      <span>QQ 知識海域<small>THE KNOWLEDGE ARCHIPELAGO</small></span>
    </a>
    <nav id="island-navigation" class="island-navigation" aria-label="五座知識島嶼"></nav>
    <button class="index-button" id="open-library" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>教材索引</span><kbd>/</kbd></button>
  </header>
  <main id="experience">
    <div id="world" aria-label="五座知識島嶼的互動海域"></div><div id="world-labels"></div>
    <div class="scene-loader" id="scene-loader" role="status"><span class="loader-compass">✧</span><span>正在展開你的知識海圖</span></div>
    <div class="fallback" id="fallback" hidden><p>選一座島，開始你的學習旅程。</p><div id="fallback-islands"></div></div>
    <section class="introduction" id="introduction">
      <p class="eyebrow"><span></span> QQ 老師的教學分享區</p>
      <h1>讓好奇心，<br>帶你<span>出航。</span></h1>
      <p class="intro-copy">每座島，都是一種看世界的方式。<br>在知識的海域裡，找到自己的航向。</p>
      <button class="primary-button" id="start-exploring" type="button">開啟第一段航程 <span aria-hidden="true">↗</span></button>
      <div class="intro-footnote"><span class="small-compass">✧</span><p>從一座島開始，<br>讓想像連接下一片風景。</p></div>
    </section>
    <div class="map-heading" id="map-heading"><span class="map-coordinate">24°09′ N &nbsp; 120°40′ E</span><span class="map-name">海域全覽 <i>／</i> 五島，自由探索</span></div>
    <button class="back-to-sea" id="back-to-sea" type="button" hidden>← 返回海域</button>
    <div class="map-tools" aria-label="海圖控制"><button id="zoom-in" type="button" aria-label="放大海圖" title="放大">＋</button><button id="zoom-out" type="button" aria-label="縮小海圖" title="縮小">−</button><span></span><button id="reset-view" type="button" aria-label="重設目前視角" title="重設視角">⌖</button></div>
    <div class="map-compass" aria-hidden="true"><span>N</span><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="m32 9 7 23-7 23-7-23z"/><path d="M6 32h12m28 0h12"/></svg></div>
    <aside class="island-panel" id="island-panel" aria-label="島嶼與教材導覽" hidden></aside>
    <footer class="sea-footer"><span class="footer-author"><span class="status-dot"></span> 林文彥 QQ 老師 <i>／</i> 國立臺中科技大學</span><span class="exploration-hint" id="exploration-hint">拖曳探索 · 滾輪縮放 · 點選島嶼登岸</span><button id="motion-toggle" type="button" aria-pressed="true"><span aria-hidden="true">≈</span><span id="motion-label">海域動態 開</span></button></footer>
  </main>
  <dialog id="library-dialog" class="library-dialog" aria-labelledby="library-title">
    <div class="library-header"><div><p class="eyebrow">YOUR NEXT DESTINATION</p><h2 id="library-title">下一站，想學什麼？</h2></div><button class="icon-button" data-close-library aria-label="關閉教材索引" type="button">×</button></div>
    <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="library-search" type="search" placeholder="搜尋 Docker、Blueprint、研究、AI…" autocomplete="off"></label>
    <div class="library-filters" id="library-filters" aria-label="依島嶼篩選"></div><p id="library-count" class="library-count" aria-live="polite"></p><div class="library-results" id="library-results"></div>
  </dialog>
  <section class="reader" id="reader" aria-label="教材閱讀區" hidden>
    <header class="reader-header"><button id="reader-back" class="reader-back" type="button">← 返回島嶼</button><div><span id="reader-island"></span><h2 id="reader-title"></h2></div><a id="reader-external" target="_blank" rel="noopener" aria-label="在新分頁開啟教材">獨立閱讀 ↗</a></header>
    <div class="reader-body"><nav id="reader-siblings" aria-label="同主題教材"></nav><div class="reader-content"><div id="reader-loading" class="reader-loading" role="status">正在打開教材…</div><iframe id="lesson-frame" title="教學教材" loading="lazy" referrerpolicy="same-origin"></iframe></div></div>
  </section>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-links">請選擇教學專區：<a href="linux/">Linux</a><a href="unreal/">Unreal</a><a href="tpr/">TPR 教學實踐</a><a href="admin/">行政 AI</a><a href="https://www.youtube.com/@qqnicetw/playlists">YouTube 影音</a></div></noscript>
  <script type="module" src="assets/islands/app.js"></script>
</body>
</html>
